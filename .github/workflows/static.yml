# Simple workflow for deploying static content to GitHub Pages
name: Deploy documentation to Github Pages

on:
 push:
   tags:
     - 'v*'    # trigger on vX, vX.Y, vX.Y.Z, etc.
 workflow_dispatch:

permissions:
 contents: write   # required to write on gh-pages

jobs:
 build-and-deploy:
   runs-on: ubuntu-latest

   env:
     ECOGEN_ENV: production
     TARGET_BRANCH: gh-pages
     # Reuse GitHub Actions token to push.
     GIT_DEPLOY_REPO: https://${{ secrets.GITHUB_TOKEN }}@github.com/code-mphi/ECOGEN.git

     # Shims Travis
     TRAVIS: "true"
     TRAVIS_REPO_SLUG: ${{ github.repository }}
     TRAVIS_BUILD_DIR: ${{ github.workspace }}
     TRAVIS_BRANCH: ${{ github.ref_name }}
     TRAVIS_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

   steps:
     - name: Checkout repo (with tags)
       uses: actions/checkout@v4
       with:
         fetch-depth: 0

     - name: Set up Python
       uses: actions/setup-python@v5
       with:
         python-version: '3.x'
         cache: 'pip'

     - name: Install APT dependencies (doxygen, graphviz, TeX)
       run: |
         sudo apt-get update
         sudo apt-get install -y \
           doxygen doxygen-doc doxygen-latex doxygen-gui \
           graphviz \
           texlive texlive-latex-extra latexmk

     - name: Install Python dependencies (Sphinx toolchain)
       run: |
         python -m pip install --upgrade pip
         pip install sphinx sphinx_rtd_theme sphinx-numfig sphinxcontrib-bibtex

     - name: Configure Git user (for gh-pages push)
       run: |
         git config user.name "Travis CI"
         git config user.email "ecogen@code-mphi.fr"

     - name: Run build & deploy script
       run: |
         bash ./scripts/travis/buildAndDeploy.sh
